acceptance_composite:
  input: Iam David, fili Israel, quis est maior omnibus? Cuius ieiunium et iusiurandum, traiecit MVII.
  expected_output: Jam David, fili Israel, quis est major omnibus? Cujus jejunium et jusiurandum, trajecit MVII.
  note: 'Single sentence exercises: case-preserve (Iam->Jam), exception (Israel un-ligatured), maior->major, Cuius->Cujus,
    ieiunium->jejunium (NOT jeiunium), iusiurandum->jusiurandum (case-preserving, NOT Jusiurandum), traiect->trajecit (b7bda42
    perfect stem), and ''MVII'' left intact (no V->U bug). Confirmed by probe.py and battery3.py: match == True.'
  idempotent: true
  idempotency_evidence: 'scripts/battery3.py: normalize(normalize(input)) == normalize(input) confirmed OK. The composite
    appears verbatim on t_6e9130f8 spark comment (run_id 307) and in latinJ commit ef185c4 README v2 section.'
